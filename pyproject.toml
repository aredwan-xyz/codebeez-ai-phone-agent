[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-phone-agent"
version = "1.0.0"
description = "Ultimate AI Phone Agent — real-time voice, sub-800ms latency, Claude + Deepgram + ElevenLabs"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # Anthropic
    "anthropic>=0.40.0",

    # Telephony
    "twilio>=9.3.0",

    # STT
    "deepgram-sdk>=3.7.0",

    # TTS
    "elevenlabs>=1.9.0",

    # Audio processing
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pydub>=0.25.1",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Cache / session
    "redis[hiredis]>=5.0.0",
    "aioredis>=2.0.1",

    # Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",

    # HTTP client
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",

    # Google Calendar (optional)
    "google-api-python-client>=2.147.0",
    "google-auth-oauthlib>=1.2.0",

    # RAG / embeddings
    "openai>=1.51.0",   # for embeddings fallback
    "faiss-cpu>=1.8.0",

    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",

    # Utilities
    "tenacity>=9.0.0",
    "shortuuid>=1.0.13",
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
